<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashBrain Estudia como un crack</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header>
      <div class="logo">🧠 FlashBrain</div>
      <p class="tagline">Pega tus apuntes y crea flashcards en segundos </p>
    </header>

    <!-- API Key -->
    <div class="api-box">
      <label>🔑 Tu API Key de Anthropic</label>
      <div class="api-row">
        <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
      </div>
      <p class="api-hint">
        Consigue tu clave gratis en
        <a href="https://console.anthropic.com" target="_blank">console.anthropic.com</a>
        — se guarda solo en tu navegador.
      </p>
    </div>

    <!-- Input -->
    <div class="input-card">
      <label>Pega aquí tus apuntes</label>
      <textarea
        id="notesInput"
        placeholder="Escribe o pega el texto que quieres convertir en flashcards... Por ejemplo: 'La fotosíntesis es el proceso por el que las plantas fabrican su propio alimento usando la luz del sol...'"
      ></textarea>
      <div class="subject-row" id="subjectRow">
        <button class="subject-btn active" data-subject="">General</button>
        <button class="subject-btn" data-subject="Ciencias naturales">Naturales</button>
        <button class="subject-btn" data-subject="Matemáticas">Mates</button>
        <button class="subject-btn" data-subject="Historia">Historia</button>
        <button class="subject-btn" data-subject="Lengua y literatura">Lengua</button>
        <button class="subject-btn" data-subject="Inglés">Inglés</button>
      </div>
    </div>

    <!-- Generate -->
    <button class="btn-generate" id="generateBtn">Crear mis flashcards</button>

    <!-- Error -->
    <div class="error-box" id="errorBox"></div>

    <!-- Loading -->
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p class="loading-text" id="loadingText">Generando tus flashcards...</p>
    </div>

    <!-- Results -->
    <div id="results" style="display:none">
      <div class="stats-bar">
        <h2 id="resultsTitle">Tus flashcards</h2>
        <span class="progress-text" id="progressText"></span>
      </div>
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="actions">
        <button class="btn-secondary" id="flipAllBtn">Ver todas las respuestas</button>
        <button class="btn-secondary" id="shuffleBtn">Mezclar</button>
        <button class="btn-secondary" id="resetBtn">Nueva sesión</button>
      </div>
    </div>

  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
